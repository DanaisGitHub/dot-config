# Mouse support (essential)
set -g mouse on

# Vi mode for copy (much better)
setw -g mode-keys vi

# Vi-style copy keybinds
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Renumber windows when one is closed
set -g renumber-windows on

# Better split keybinds (intuitive: | for vertical, - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick pane switching with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Increase scrollback buffer
set -g history-limit 10000

# Don't rename windows automatically
set -g allow-rename off

bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"

# Tmux plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

# Continuum settings
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'fullscreen'
set -g @continuum-save-interval '15'

# Net speed format (upload/download)
set -g @net_speed_format "↓ %10s ↑ %10s"

# CPU threshold colors
set -g @cpu_icon '♨'
set -g @cpu_percentage true

# Status bar with CPU and net speed
set -g status-right "#{cpu_icon} #{cpu_percentage} | #{net_speed} | #(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) | %H:%M %d-%b-%y"

# Initialize TPM (Tmux Plugin Manager)
run '~/.tmux/plugins/tpm/tpm'
